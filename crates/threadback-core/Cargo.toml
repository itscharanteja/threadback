[package]
name = "threadback-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# The HTTP client for the model. `tb` leaves it off, so the command wrapper
# contains no network code at all.
default = ["model-client", "keychain"]
model-client = ["dep:reqwest", "dep:tokio"]
# The macOS Keychain adapter for the API key. `tb` does not need it either.
keychain = ["dep:keyring"]

[dependencies]
chrono.workspace = true
jsonschema = { version = "0.58.5", default-features = false }
memchr.workspace = true
regex.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
ts-rs.workspace = true
uuid.workspace = true
url.workspace = true
reqwest = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { workspace = true, features = ["apple-native"], optional = true }

[dev-dependencies]
tempfile.workspace = true
