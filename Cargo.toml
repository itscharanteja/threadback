[workspace]
members = ["src-tauri", "crates/threadback-core", "crates/tb-cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
chrono = { version = "0.4", features = ["serde"] }
libc = "0.2"
memchr = "2"
regex = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
ts-rs = { version = "11", features = ["chrono-impl", "serde-json-impl"] }
uuid = { version = "1", features = ["serde", "v4"] }

# The regex engine is on the path of every byte `tb` stores. Unoptimized it is
# about 10x slower, which makes debug builds and the test suite crawl, so it
# is always built with optimizations. Our own code keeps the normal dev profile.
[profile.dev.package.regex]
opt-level = 3
[profile.dev.package.regex-automata]
opt-level = 3
[profile.dev.package.regex-syntax]
opt-level = 3
[profile.dev.package.aho-corasick]
opt-level = 3
[profile.dev.package.memchr]
opt-level = 3
