<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ThreadBack · UI draft</title>
<style>
:root{--bg:#f7f8f5;--paper:#fff;--ink:#24332c;--muted:#65716a;--line:#dce2dc;--green:#33664c;--soft:#eaf1eb;--amber:#faf1de;--danger:#984433;font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--ink);background:var(--bg);line-height:1.55}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);padding:10px 16px;min-height:44px}button:hover{background:var(--soft)}button:disabled{opacity:.5;cursor:default}.primary{background:var(--green);color:white;border-color:var(--green)}.primary:hover{background:#27533d}.quiet{border:0;background:transparent;padding:8px}.app{display:grid;grid-template-columns:220px 1fr;min-height:850px}.sidebar{background:#f0f3ed;border-right:1px solid var(--line);padding:32px 20px;display:flex;flex-direction:column;gap:28px}.brand{font-size:22px;letter-spacing:-1px;font-weight:650}.logo{display:inline-grid;place-items:center;background:var(--green);color:#fff;border-radius:10px;width:32px;height:32px;margin-right:8px}.sidebar nav{display:grid;gap:6px}.sidebar nav button{text-align:left;background:transparent;border:0}.sidebar nav button[aria-current=page]{background:var(--soft);font-weight:600}.sidebar footer{margin-top:auto;font-size:13px;color:var(--muted)}.chrome{padding:18px 40px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:16px;color:var(--muted);font-size:13px;background:var(--paper)}.draft{border-bottom:1px solid var(--line);padding:12px 24px;background:var(--paper);display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:13px}.draft select{padding:5px;max-width:100%;border:1px solid var(--line);background:var(--paper);border-radius:6px}.main{padding:42px 48px 64px;max-width:1100px;margin:auto}h1{font-size:32px;line-height:1.2;letter-spacing:-1px;margin:10px 0 12px}h2{font-size:20px;letter-spacing:-.4px;margin:0 0 12px}h3{font-size:16px;margin:0 0 4px}p{margin:0 0 12px}.sub{color:var(--muted);max-width:650px}.eyebrow{font-size:12px;letter-spacing:1.1px;text-transform:uppercase;color:var(--muted)}.panel{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:24px;margin:24px 0}.hero{background:var(--soft);border-color:#d6e3d8}.row{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.badge{display:inline-block;padding:4px 10px;background:var(--soft);color:var(--green);border-radius:20px;font-size:12px}.warning{background:var(--amber);color:#775622}.blocked{border-color:#d9b8ad;background:#fff8f5}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin:32px 0}.step{border-top:1px solid var(--line);padding-top:16px}.step b{font-size:13px;color:var(--green)}.item{padding:19px 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}.item p{margin:4px 0;color:var(--muted);font-size:14px}.field{display:grid;gap:8px;margin:20px 0}.field label{font-weight:550}.field small{color:var(--muted)}input:not([type=checkbox]),textarea,select{width:100%;padding:12px 14px;border:1px solid var(--line);background:var(--paper);border-radius:8px;color:var(--ink)}textarea{resize:vertical;min-height:90px}.check{display:flex;gap:12px;align-items:flex-start;padding:12px 0}.check input{width:18px;height:18px;margin-top:4px;flex-shrink:0}.progress{display:flex;gap:24px;flex-wrap:wrap;margin:26px 0;color:var(--muted);font-size:13px}.progress .active{color:var(--green);font-weight:600}details{margin:18px 0}summary{cursor:pointer;font-size:14px;color:var(--green)}pre{white-space:pre-wrap;overflow-wrap:anywhere;padding:16px;background:var(--bg);border-radius:8px;font-size:13px}code{font-family:ui-monospace,monospace;font-size:13px;overflow-wrap:anywhere}.split{display:grid;grid-template-columns:1.5fr 1fr;gap:24px}.split .panel{margin:0}.timeline{list-style:none;margin:0;padding:0}.timeline li{padding:16px 0 16px 20px;border-left:2px solid var(--line);position:relative}.timeline li:before{content:'';width:8px;height:8px;background:var(--green);border-radius:50%;position:absolute;left:-5px;top:24px}.timeline time{color:var(--muted);font-size:12px}.timeline p{margin:4px 0;font-size:14px}.notice{padding:16px 20px;border-radius:10px;background:var(--soft);margin:24px 0}.notice.warning{background:var(--amber)}.notice p{margin:4px 0;font-size:14px}.source{font-size:12px;color:var(--green)}#toast{color:var(--green);font-size:14px;margin-top:18px;min-height:22px}.danger{color:var(--danger)}@media(max-width:800px){.app{grid-template-columns:1fr}.sidebar{padding:16px 20px;border-right:0;gap:12px}.sidebar nav{display:flex;flex-wrap:wrap}.sidebar footer{display:none}.main{padding:26px 20px}.chrome{padding:12px 20px}.split,.grid{grid-template-columns:1fr}.grid{gap:12px}h1{font-size:28px}}
</style>
<div class="draft"><strong>Design draft · sample data</strong><label for="screen">Explore screen</label><select id="screen" style="width:auto"></select><span>No project data is collected or sent.</span></div>
<div class="app"><aside class="sidebar"><div class="brand"><span class="logo">↩</span>ThreadBack</div><nav aria-label="Main"><button data-go="home">Your work</button><button data-go="privacy">Privacy</button><button data-go="settings">AI connection</button></nav><footer>Saved on this computer<br>You decide what gets shared.</footer></aside><div><header class="chrome"><span id="breadcrumb">Your work</span><span id="status">○ Nothing being recorded</span></header><main class="main" id="content"></main></div></div>
